Cómo funcionan los flags en GBA RPGs:

text


- Se almacenan en SRAM (archivo .sav)

- Direcciones típicas: 0x02000000 - 0x0203FFFF (EWRAM)

- Cada bit representa un evento (sí/no)

- Ejemplo: Flag 0x01 = "Goku desbloqueado", Flag 0x02 = "Saga de Cell completada"
Herramientas para encontrar flags:

VBA-SDL-H: Emulador con debugger para rastrear cambios en memoria

Cheat Engine: Buscar valores que cambian al completar eventos

HxD: Editor hexadecimal para analizar archivos .sav

