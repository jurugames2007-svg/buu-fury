Vamos a hacer un juego independiente para Windows, inspirado en el ritmo, combate, exploración y progresión de Buu’s Fury, pero sin depender de GBA, ROMs, límites de memoria ni hooks inestables.

Ya dejé creada la base de preproducción en el repositorio:

standalone_game/README.md
standalone_game/GAME_DESIGN.md
standalone_game/ASSET_POLICY.md
Decisiones aplicadas
Plataforma: Windows (.exe).
Motor objetivo: Godot 4.
Primera campaña: GT desde las Black Star Dragon Balls hasta Baby.
Nivel máximo: 600.
Assets: solo fanmade con permiso verificable u originales nuevos para el ejecutable. Los juegos de GBA servirán como referencia de estilo y sistemas, no se empaquetarán sus ROMs ni assets comerciales.
Primera versión jugable real
El primer vertical slice será:

Amega → recuperación de la nave → Don Kee → Legic

Incluirá:

Goku niño, Pan y Trunks intercambiables.
Giru como radar y apoyo.
Combate físico, ki, bloqueo, esquiva y técnicas.
NPCs, misión principal, cofre, tienda, secretos y guardado.
Jefe Legic por fases.
Build Windows probado antes de entregarlo.
Luego se expande con Masu, Jaga Bada, Luud, M-2, Dr. Mew, Rilldo, Baby y el regreso a la Tierra. AF quedará como continuación/postgame con Zaiko, Karat, Evil Goku, Angel Z, Void World, SSJ5–SSJ7 y el resto de tu historia.


