Hay assets en el repositorio, pero todavía no hay manifiesto de autoría/licencia ni selección aprobada para empaquetar.

Build .exe jugable: 0%

Estado global honesto: aprox. 2%
Lo anterior no es una demo ni un juego funcional todavía: es una base de diseño. El siguiente hito real debe ser un prototipo jugable pequeño de Otro Mundo / Snake Way, con movimiento, combate, NPC, misión, guardado y un jefe. Cuando eso exista y se pruebe, recién podríamos hablar de un porcentaje de producción más alto.


