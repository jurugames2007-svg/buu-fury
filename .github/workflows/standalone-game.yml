Exactamente: la estructura correcta será una campaña base estilo Buu’s Fury y, dentro del mismo ejecutable, expansiones accesibles mediante Bills.

Ya actualicé el diseño con esta estructura:

Campaña base — Buu’s Fury Reborn

Historia de Majin Buu recreada de forma original.
Otro Mundo, Snake Way, torneo, Gran Saiyaman, Babidi, Majin Vegeta, Buu, Vegito y Kid Buu.
Sistema de exploración, combate, niveles, equipo, habilidades y personajes inspirado en Buu’s Fury.
GT DLC — Grand Tour

Se desbloquea al terminar Kid Buu.
Bills aparece en el Mundo Sagrado de los Kaioshin.
Abre el portal hacia la aventura de las Black Star Dragon Balls: Goku niño, Pan, Trunks, Giru, Amega, Luud, M-2, Baby y luego Super 17/Shadow Dragons.
AF DLC — Divine Aftermath

Se desbloquea después de completar los hitos principales de GT y una prueba de Bills.
Incluye Zaiko, Karat, Evil Goku, Angel Z, Irina, Void World y los arcos SSJ5–SSJ7 que describiste.
Bills será un NPC hub, no un reemplazo de contenido: hablar con él muestra las campañas, requisitos, progreso y abre portales. También permitirá volver a contenido ya completado para secretos, jefes opcionales, misiones y easter eggs.

El primer prototipo jugable cambia para comenzar como corresponde: Otro Mundo → Snake Way → primera misión de Goku. GT y AF aparecerán bloqueados en la interfaz hasta terminar la campaña base.


